    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f9fafb;
        color: #111827;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f3f4f6; 
      }
      ::-webkit-scrollbar-thumb {
        background: #d1d5db; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #9ca3af; 
      }
      
      /* Slow Ping Animation */
      @keyframes ping-slow {
        75%, 100% {
          transform: scale(2);
          opacity: 0;
        }
      }
      .animate-ping-slow {
        animation: ping-slow 3s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      @keyframes slop-scan {
        0% {
          transform: translateY(-80px);
          opacity: 0;
        }
        18% {
          opacity: 1;
        }
        72% {
          opacity: 0.8;
        }
        100% {
          transform: translateY(520px);
          opacity: 0;
        }
      }

      @keyframes slop-orbit {
        from {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        to {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      @keyframes slop-bar-fill {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }

      .slop-chart-scan {
        animation: slop-scan 4.8s ease-in-out 1 both;
      }

      .slop-chart-orbit {
        animation: slop-orbit 12s linear infinite;
        filter: blur(14px);
      }

      .slop-chart-segment {
        transition: filter 180ms ease, opacity 180ms ease;
      }

      .slop-chart-segment:hover {
        filter: drop-shadow(0 0 10px rgba(15, 118, 110, 0.35));
        opacity: 0.92;
      }

      .slop-contributor-bar {
        animation: slop-bar-fill 900ms ease-out both;
        transform-origin: left center;
      }

      @media (prefers-reduced-motion: reduce) {
        .slop-chart-scan,
        .slop-chart-orbit,
        .slop-contributor-bar {
          animation: none;
        }
      }
    </style>
